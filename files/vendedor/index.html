<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astoria | Área do Vendedor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Cabeçalho -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 26C6 18 12 12 20 12C26 12 30 15 33 19" stroke="#EE2E2A" stroke-width="4" stroke-linecap="round"/>
          <circle cx="20" cy="24" r="9" stroke="#EE2E2A" stroke-width="4"/>
        </svg>
        <span class="brand-name">Astoria</span>
      </div>

      <div class="user-info">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="4" stroke="#F5F5F5" stroke-width="1.5"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="user-name">Ronaldo Ribeiro</span>
      </div>
    </header>

    <div class="app-body">

      <!-- Menu lateral -->
      <nav class="sidebar" aria-label="Menu principal">
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6h16M4 12h16M4 18h16" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Menu</span>
        </button>

        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="3" stroke="#F5F5F5" stroke-width="1.6"/>
            <path d="M19.4 13.5c.04-.5.04-1 0-1.5l2-1.6-2-3.4-2.4 1a7.9 7.9 0 0 0-1.3-.75L15.3 4h-4l-.4 2.7c-.46.2-.9.45-1.3.75l-2.4-1-2 3.4 2 1.6a6.7 6.7 0 0 0 0 1.5l-2 1.6 2 3.4 2.4-1c.4.3.84.55 1.3.75l.4 2.7h4l.4-2.7c.46-.2.9-.45 1.3-.75l2.4 1 2-3.4-2-1.6Z" stroke="#F5F5F5" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          <span>Configurações</span>
        </a>

        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 9h16l-1.4 9.4A2 2 0 0 1 16.6 20H7.4a2 2 0 0 1-2-1.6L4 9Z" stroke="#F5F5F5" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M8 9V7a4 4 0 0 1 8 0v2" stroke="#F5F5F5" stroke-width="1.6"/>
          </svg>
          <span>Meus Pedidos</span>
        </a>

        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8.5" cy="8" r="3" stroke="#F5F5F5" stroke-width="1.5"/>
            <path d="M2.5 19c0-3 2.7-5.3 6-5.3s6 2.3 6 5.3" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="16.5" cy="8.5" r="2.3" stroke="#F5F5F5" stroke-width="1.5"/>
            <path d="M15 13.9c2.7.3 4.8 2.3 4.8 5.1" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Vendedores</span>
        </a>

        <a class="nav-item" href="#">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="3" width="14" height="18" rx="1.5" stroke="#F5F5F5" stroke-width="1.5"/>
            <path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Relatórios</span>
        </a>
      </nav>

      <!-- Conteúdo principal -->
      <main class="content">
        <div class="toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="6.5" stroke="#C7C8D1" stroke-width="1.6"/>
              <path d="M20 20l-4-4" stroke="#C7C8D1" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input type="text" placeholder="Pesquisar...">
          </div>

          <button class="icon-btn" aria-label="Carrinho">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 4h2l2.4 12.2A2 2 0 0 0 9.4 18h7.2a2 2 0 0 0 2-1.6L20 7H6" stroke="#F2F2F2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="10" cy="21" r="1.4" fill="#F2F2F2"/>
              <circle cx="17" cy="21" r="1.4" fill="#F2F2F2"/>
            </svg>
          </button>
        </div>

        <div class="action-row">
          <button class="select-btn">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="9" cy="8" r="3" stroke="#F5F5F5" stroke-width="1.5"/>
              <path d="M3.5 18c0-2.8 2.5-5 5.5-5s5.5 2.2 5.5 5" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="16.5" cy="8.5" r="2.2" stroke="#F5F5F5" stroke-width="1.5"/>
              <path d="M15.2 13.4c2.4.4 4.3 2.2 4.3 4.6" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Selecionar Clientes
          </button>
        </div>

        <section class="card">
          <div class="card-header">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 7v5l3.2 1.9" stroke="#4A4B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4.6 9A8 8 0 1 1 4 13" stroke="#4A4B57" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M4 5v4h4" stroke="#4A4B57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Histórico de pedidos</span>
          </div>

          <div class="card-body card-body--empty">
            <p>Nenhum pedido encontrado ainda.</p>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
